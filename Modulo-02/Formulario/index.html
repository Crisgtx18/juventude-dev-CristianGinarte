<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <input type="text" placeholder="Enter your first name" id="name">
        <input type="email" placeholder="Enter your email" id="email">
        <input type="password" placeholder="Enter your password" id="password">
        <input type="number" placeholder="Enter your age" id="age">
        <input type="date" placeholder="Enter your date of birth" id="dob">
        <select id="sex">
            <option value="">Select your sex</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <button onclick="printName()">Check</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
